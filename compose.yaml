services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: wobot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
      POSTGRES_DB: wobot_db
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - wobot_network

  wobot:
    build: .
    image: wobot
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    environment:
      XDG_CACHE_HOME: /tmp
      DATABASE_URL: postgres://wobot:${POSTGRES_PASSWORD:-example}@db:5432/wobot_db
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./assets:/app/assets:ro
    networks:
      - wobot_network

networks:
  wobot_network:
    driver: bridge
